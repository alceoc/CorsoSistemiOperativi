<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAMIFICATION Dentro la cipolla – il gioco del sistema operativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#13223F; --panel:#1B2E52; --panel2:#233A63; --line:#34507F;
  --ink:#EEF2F8; --muted:#A9B6CC;
  --y:#FFD966; --g:#C9C9C9; --lb:#8EA9DB; --gr:#548235; --grl:#7DBA5C; --pe:#F4B183; --bl:#4472C4;
  --ok:#8FD18F; --ko:#FF8F80; --dark:#1C2433;
  --head:'Chakra Petch', 'Trebuchet MS', sans-serif;
  --body:'Atkinson Hyperlegible', Verdana, Arial, sans-serif;
  --mono:'JetBrains Mono', Consolas, 'Courier New', monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--y);outline-offset:2px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:24px}
.btn{border:2px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 18px;border-radius:10px;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--y);border-color:var(--y);color:var(--dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
code,.mono{font-family:var(--mono)}
code{background:#0E1930;padding:1px 6px;border-radius:5px;color:var(--y)}

/* MAP */
.map{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;min-height:calc(100vh - 48px)}
.map h1{font-size:clamp(40px,6vw,76px);letter-spacing:-1px}
.map .lead{font-size:20px;color:var(--muted);max-width:34em;margin:14px 0 24px}
.onion{width:100%;max-width:560px;margin:0 auto;display:block}
.onion .ring{cursor:pointer;transition:filter .15s}
.onion .ring:hover,.onion .ring:focus-visible{filter:brightness(1.12)}
.onion .ring.locked{cursor:not-allowed}
.onion text{font-family:var(--head);font-weight:700;pointer-events:none}
.levels{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.lvl{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink)}
.lvl:hover:not(:disabled){border-color:var(--muted)}
.lvl:disabled{opacity:.5;cursor:not-allowed}
.lvl .dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--head);font-weight:700;color:var(--dark)}
.lvl .t{flex:1;font-weight:700}
.lvl .s{font-size:15px;color:var(--muted)}
.lvl .badge{font-size:14px;color:var(--ok);font-weight:700}
.scorebox{display:flex;gap:28px;align-items:baseline;margin-bottom:16px}
.scorebox b{font-family:var(--head);font-size:34px;color:var(--y)}
.teacher{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--muted)}
.teacher label{display:flex;gap:8px;align-items:center;cursor:pointer}

/* LEVEL */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.chip{font-family:var(--head);font-weight:700;padding:6px 14px;border-radius:999px;color:var(--dark)}
.top h2{font-size:28px;flex:1;min-width:200px}
.hearts{font-size:26px;letter-spacing:4px;color:var(--ko)}
.hearts .off{color:#4A5E83}
.pts{font-family:var(--head);font-size:24px;color:var(--y);min-width:110px;text-align:right}
.mission{background:var(--panel);border-left:6px solid var(--y);border-radius:10px;padding:14px 18px;margin-bottom:18px;color:var(--ink)}
.feedback{min-height:56px;margin-top:18px;padding:14px 18px;border-radius:10px;background:var(--panel);border:2px solid var(--line)}
.feedback.ok{border-color:var(--ok)}
.feedback.ko{border-color:var(--ko)}
.feedback .tag{font-family:var(--head);font-weight:700;margin-right:8px}
.feedback.ok .tag{color:var(--ok)} .feedback.ko .tag{color:var(--ko)}
.row{display:flex;gap:20px;flex-wrap:wrap}
.col{flex:1;min-width:260px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px}
.panel h3{font-size:20px;margin-bottom:10px}

/* terminal */
.term{background:#0B1426;border:2px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:16px;padding:14px;height:420px;overflow-y:auto;cursor:text}
.term .l{white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--grl)} .term .d{color:var(--lb)} .term .e{color:var(--ko)}
.term .in{display:flex;gap:8px}
.term input{flex:1;background:transparent;border:none;color:var(--ink);font:inherit;outline:none;min-width:40px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tasks li{padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:16px;opacity:.55}
.tasks li.now{opacity:1;border:2px solid var(--y)}
.tasks li.done{opacity:.8}
.tasks li.done::before{content:"✓ ";color:var(--ok);font-weight:700}
.tasks .gui{display:block;color:var(--muted);font-size:15px}

/* blocks */
.grid48{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.cell{aspect-ratio:1;border-radius:7px;border:2px solid #4A5E83;background:#0E1930;color:var(--muted);font-family:var(--mono);font-size:14px;display:grid;place-items:center;padding:0}
.cell.used{background:#5B6B87;color:var(--ink);border-color:#5B6B87}
.cell.meta{background:#2B2F3A;border-color:#2B2F3A;color:#7D8699;cursor:not-allowed}
.cell.sel{outline:3px solid var(--y);outline-offset:-1px;background:var(--y);color:var(--dark);border-color:var(--y)}
.cell.show{background:var(--ok);color:var(--dark);border-color:var(--ok)}
table.fst{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:15px}
table.fst th,table.fst td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
table.fst th{color:var(--muted);font-family:var(--body)}
table.fst tr.target td{color:var(--y);font-weight:700}

/* quiz */
.quiz h3{font-size:24px;margin:6px 0 16px;font-family:var(--body)}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 16px}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.right{border-color:var(--ok);background:#24452F}
.opt.wrong{border-color:var(--ko);background:#4A2A2E}

/* io */
.dev,.drv{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.dev.sel{border-color:var(--y)}
.dev .st{font-size:14px;color:var(--ko)}
.dev.okd .st{color:var(--ok)}
.drv.used{opacity:.4}

/* memory */
.ram{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;background:#0B1426;border:2px solid var(--line);border-radius:12px;padding:6px}
.slot{height:110px;border-radius:8px;border:2px dashed #4A5E83;background:transparent;color:var(--muted);display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:14px;padding:4px}
.slot.full{border-style:solid;color:var(--dark);font-weight:700}
.slot .gb{font-family:var(--mono);font-size:13px;opacity:.8}
.swap{display:flex;gap:8px;flex-wrap:wrap;min-height:64px;align-items:center;border:2px dashed var(--muted);border-radius:12px;padding:10px}
.swapitem{border:none;border-radius:8px;padding:8px 12px;font-weight:700;color:var(--dark)}
.meter{height:12px;background:#0B1426;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* cpu */
.procs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.proc{background:var(--panel2);border:3px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);text-align:left}
.proc h4{margin:0 0 6px;font-family:var(--head);font-size:20px}
.proc .state{font-size:14px;font-weight:700}
.proc.attesa{opacity:.6;border-style:dashed}
.proc.finito{opacity:.35}
.bar{height:10px;background:#0B1426;border-radius:5px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%}
.queue{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:44px}
.qi{padding:6px 12px;border-radius:8px;font-weight:700;color:var(--dark)}
.gantt{display:flex;gap:2px;min-height:40px;flex-wrap:wrap}
.gantt span{width:40px;height:40px;display:grid;place-items:center;border-radius:6px;font-weight:700;color:var(--dark)}
.gantt span.irq{background:#FF8F80}
.irqbox{border:3px solid var(--ko);background:#3A2433;border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.irqbox .cd{font-family:var(--head);font-size:40px;color:var(--ko);min-width:50px;text-align:center}

/* boss */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stepc{background:var(--panel2);border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:14px;text-align:left}
.stepc:disabled{opacity:.3}
.seq{display:flex;flex-direction:column;gap:6px}
.seq div{padding:8px 12px;border-radius:8px;color:var(--dark);font-weight:700}

/* overlays */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;z-index:10;background:rgba(10,18,34,.8)}
.ov.on{display:flex}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:32px;max-width:560px;width:100%;text-align:center}
.medal{width:120px;height:120px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:54px;border:6px solid var(--ink)}
.card h2{font-size:32px;margin-bottom:8px}
.card .acts{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.bsod{background:#1668C4;color:#fff;text-align:left;align-items:flex-start;justify-content:flex-start}
.bsod .in{max-width:900px;margin:10vh auto 0;padding:24px}
.bsod .face{font-size:120px;line-height:1;font-family:var(--body)}
.bsod h2{font-family:var(--body);font-weight:400;font-size:30px;margin:24px 0 16px}
.bsod .btn{background:#fff;color:#1668C4;border-color:#fff}
.bsod .btn.alt{background:transparent;color:#fff}

@media (max-width:860px){
  .map{grid-template-columns:1fr;min-height:0}
  .procs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:1fr}
  .slot{height:80px;font-size:12px}
  .grid48{grid-template-columns:repeat(8,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<div id="ovDone" class="ov" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="card">
    <div class="medal" id="medal">★</div>
    <h2 id="doneTitle">Livello completato</h2>
    <p id="doneText" class="muted"></p>
    <div class="acts" id="doneActs"></div>
  </div>
</div>

<div id="ovBsod" class="ov bsod" role="dialog" aria-modal="true" aria-labelledby="bsodTitle">
  <div class="in">
    <div class="face">:(</div>
    <h2 id="bsodTitle">Il livello ha riscontrato un problema e deve essere riavviato.</h2>
    <p id="bsodText"></p>
    <p style="margin-top:16px;opacity:.8">Codice di arresto: VITE_ESAURITE</p>
    <div style="display:flex;gap:12px;margin-top:28px;flex-wrap:wrap">
      <button class="btn" id="bsodRetry">Riprova il livello</button>
      <button class="btn alt" id="bsodMap">Torna alla mappa</button>
    </div>
  </div>
</div>

<script>
/* ---------- dati e stato ---------- */
const LEVELS=[
 {id:'shell',n:5,name:'Interprete dei comandi',short:'Interprete',color:'#FFD966',ink:'#1C2433',badge:'Domatore del terminale',icon:'⌨️',lives:false,
  desc:'Traduci le azioni della GUI in comandi Linux.'},
 {id:'fs',n:4,name:'File system',short:'File system',color:'#C9C9C9',ink:'#1C2433',badge:'Custode dei blocchi',icon:'🗂️',lives:true,
  desc:'Trova i blocchi dei file sull’SSD e salva le foto perse.'},
 {id:'io',n:3,name:'Input/Output',short:'Input/Output',color:'#8EA9DB',ink:'#1C2433',badge:'Mago dei driver',icon:'🖨️',lives:true,
  desc:'Dai a ogni periferica il suo driver.'},
 {id:'mem',n:2,name:'Memoria',short:'Memoria',color:'#548235',ink:'#FFFFFF',badge:'Architetto della RAM',icon:'🧩',lives:true,
  desc:'Sistema i processi in 8 GB di RAM.'},
 {id:'cpu',n:1,name:'CPU · Kernel',short:'Kernel',color:'#F4B183',ink:'#1C2433',badge:'Scheduler esperto',icon:'⚙️',lives:true,
  desc:'Fai lo scheduler e rispondi agli interrupt.'},
 {id:'boss',n:0,name:'Boss finale: il viaggio completo',short:'Boss',color:'#4472C4',ink:'#FFFFFF',badge:'Maestro della cipolla',icon:'🏆',lives:true,
  desc:'Porta un comando fino all’hardware e rispondi alle domande.'}
];
let save={unlocked:0,best:{},teacher:false};
try{const s=localStorage.getItem('cipolla-save');if(s)save=Object.assign(save,JSON.parse(s));}catch(e){}
function persist(){try{localStorage.setItem('cipolla-save',JSON.stringify(save));}catch(e){}}
const total=()=>Object.values(save.best).reduce((a,b)=>a+b,0);
const isOpen=i=>save.teacher||i<=save.unlocked;

let cur=null; // {lv, idx, lives, pts, timers:[]}
const $=s=>document.querySelector(s);
const app=$('#app');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- mappa ---------- */
function showMap(){
  clearTimers(); cur=null;
  const R=[250,208,166,124,82,44];
  let svg='';
  LEVELS.forEach((L,i)=>{
    const open=isOpen(i);
    svg+=`<circle class="ring ${open?'':'locked'}" data-i="${i}" tabindex="${open?0:-1}" role="button" aria-label="${esc(L.name)}${open?'':' (bloccato)'}" cx="260" cy="260" r="${R[i]}" fill="${open?L.color:'#34507F'}" stroke="#13223F" stroke-width="4"/>`;
  });
  LEVELS.forEach((L,i)=>{
    const open=isOpen(i);
    const y= i<5 ? 260-(R[i]+R[i+1])/2+6 : 266;
    const lab=(save.best[L.id]!==undefined?'✓ ':'')+(open?L.short:'🔒 '+L.short);
    svg+=`<text x="260" y="${y}" text-anchor="middle" font-size="${i<5?16:15}" fill="${open?L.ink:'#A9B6CC'}">${esc(lab)}</text>`;
  });
  const list=LEVELS.map((L,i)=>`<button class="lvl" data-i="${i}" ${isOpen(i)?'':'disabled'}>
      <span class="dot" style="background:${L.color};color:${L.ink}">${L.n||'★'}</span>
      <span class="t">${esc(L.name)}<span class="s" style="display:block">${esc(L.desc)}</span></span>
      ${save.best[L.id]!==undefined?`<span class="badge">${L.icon} ${save.best[L.id]} pt</span>`:(isOpen(i)?'':'<span class="s">🔒</span>')}
    </button>`).join('');
  app.innerHTML=`<div class="map">
    <svg class="onion" viewBox="0 0 520 520" role="group" aria-label="Mappa dei livelli a forma di cipolla">${svg}</svg>
    <div>
      <h1>Dentro la cipolla</h1>
      <p class="lead">Sei all'interno del Sistema Operativo utilizzato da un utente. Attraversa i livelli del sistema operativo, dall’interprete dei comandi fino all’hardware. Ogni livello superato sblocca quello più interno.</p>
      <div class="scorebox"><span>Punteggio totale <b>${total()}</b></span><span class="muted">Badge: ${Object.keys(save.best).length} di 6</span></div>
      <div class="levels">${list}</div>
      <div class="teacher">
     
        <button class="btn" id="reset" style="padding:6px 12px;font-size:15px">Azzera i progressi</button>
      </div>
    </div></div>`;
  app.querySelectorAll('[data-i]').forEach(el=>{
    const go=()=>{const i=+el.dataset.i; if(isOpen(i)) startLevel(i);};
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
  $('#teach').onchange=e=>{save.teacher=e.target.checked;persist();showMap();};
  $('#reset').onclick=e=>{const b=e.currentTarget;if(b.dataset.sure){save={unlocked:0,best:{},teacher:save.teacher};persist();showMap();}else{b.dataset.sure='1';b.textContent='Clicca di nuovo per confermare';}};
}

/* ---------- motore del livello ---------- */
function later(fn,ms){const t=setTimeout(()=>{if(cur&&!cur.over||fn.force)fn();},ms);if(cur)cur.timers.push(t);return t;}
function clearTimers(){ if(cur&&cur.timers){cur.timers.forEach(t=>{clearTimeout(t);clearInterval(t);});cur.timers=[];} }
function startLevel(i){
  clearTimers();
  const L=LEVELS[i];
  cur={lv:L,idx:i,lives:3,pts:0,timers:[],over:false};
  app.innerHTML=`<div class="top">
      <button class="btn" id="back">‹ Mappa</button>
      <span class="chip" style="background:${L.color};color:${L.ink}">${L.n?'Livello '+L.n:'Boss'}</span>
      <h2>${esc(L.name)}</h2>
      <span class="hearts" id="hearts" aria-label="Vite"></span>
      <span class="pts" id="pts">0 pt</span>
    </div>
    <div class="mission" id="mission"></div>
    <div id="play"></div>
    <div class="feedback" id="fb" aria-live="polite"><span class="muted">Qui compariranno le spiegazioni.</span></div>`;
  $('#back').onclick=showMap;
  hud();
  INIT[L.id]($('#play'));
}
function hud(){
  $('#pts').textContent=cur.pts+' pt';
  const h=$('#hearts');
  if(!cur.lv.lives){h.textContent='';return;}
  h.innerHTML=[0,1,2].map(k=>`<span class="${k<cur.lives?'':'off'}">♥</span>`).join('');
  h.setAttribute('aria-label',`Vite rimaste: ${cur.lives}`);
}
function mission(html){$('#mission').innerHTML=html;}
function fb(type,html){
  const f=$('#fb'); f.className='feedback '+(type||'');
  const tag=type==='ok'?'Giusto!':type==='ko'?'Errore:':'';
  f.innerHTML=(tag?`<span class="tag">${tag}</span>`:'')+html;
}
function gain(p,html){cur.pts+=p;hud();fb('ok',html+(p?` <b style="color:var(--y)">+${p}</b>`:''));}
function lose(html){
  if(cur.over)return;
  if(cur.lv.lives){cur.lives--;cur.pts=Math.max(0,cur.pts-20);}
  hud(); fb('ko',html);
  if(cur.lv.lives&&cur.lives<=0){cur.over=true;clearTimers();const t=setTimeout(()=>bsod(html),600);cur.timers.push(t);}
}
function bsod(last){
  $('#bsodText').innerHTML='Hai esaurito le vite. Ultimo errore: '+last;
  $('#ovBsod').classList.add('on'); $('#bsodRetry').focus();
}
$('#bsodRetry').onclick=()=>{$('#ovBsod').classList.remove('on');startLevel(cur.idx);};
$('#bsodMap').onclick=()=>{$('#ovBsod').classList.remove('on');showMap();};

function finish(extra){
  clearTimers();
  const L=cur.lv, i=cur.idx;
  const bonus=L.lives?cur.lives*50:0;
  cur.pts+=bonus; hud();
  save.best[L.id]=Math.max(save.best[L.id]||0,cur.pts);
  if(save.unlocked<i+1) save.unlocked=Math.min(i+1,LEVELS.length-1);
  persist();
  const next=LEVELS[i+1];
  $('#medal').textContent=L.icon; $('#medal').style.background=L.color;
  $('#doneTitle').textContent=(next?'Badge: ':'Hai attraversato tutta la cipolla! ')+L.badge;
  $('#doneText').innerHTML=`${extra?extra+'<br><br>':''}Punti del livello: <b>${cur.pts}</b>${bonus?` (bonus vite +${bonus})`:''}.`+
     (next?`<br>Sbloccato: <b>${esc(next.name)}</b>.`:`<br>Punteggio totale: <b>${total()}</b>.`);
  const acts=$('#doneActs'); acts.innerHTML='';
  if(next){const b=document.createElement('button');b.className='btn primary';b.textContent='Vai al livello successivo';b.onclick=()=>{$('#ovDone').classList.remove('on');startLevel(i+1);};acts.appendChild(b);}

/* quiz generico */
function quiz(el,qs,done,label){
  let i=0;
  const show=()=>{
    const q=qs[i];
    const order=shuffle(q.o.map((t,k)=>({t,k})));
    el.innerHTML=`<div class="panel quiz"><p class="muted">${label||'Domanda'} ${i+1} di ${qs.length}</p><h3>${q.q}</h3>
      <div class="opts">${order.map(o=>`<button class="opt" data-k="${o.k}">${o.t}</button>`).join('')}</div>
      <div style="margin-top:14px" id="qnext"></div></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(cur.over)return;
      const k=+b.dataset.k;
      if(k===0){
        b.classList.add('right'); el.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        gain(q.p||100,q.why);
        const n=document.createElement('button'); n.className='btn primary'; n.textContent=i<qs.length-1?'Avanti':'Continua';
        n.onclick=()=>{i++; if(i<qs.length) show(); else done();};
        $('#qnext').appendChild(n); n.focus();
      } else { b.classList.add('wrong'); b.disabled=true; lose(q.no||'non è la risposta giusta. Riprova.'); }
    });
  };
  show();
}

/* ============ LIVELLO 5: INTERPRETE ============ */
function initShell(play){
  const HOME=['home','studente'];
  const root={t:'d',c:{home:{t:'d',c:{studente:{t:'d',c:{
    Documenti:{t:'d',c:{}}, Immagini:{t:'d',c:{'gita.jpg':{t:'f',data:'(immagine)'}}},
    'leggimi.txt':{t:'f',data:'Benvenuto nel terminale! Scrivi help per vedere i comandi.'}}}}}}};
  let cwd=[...HOME]; const hist=[]; let hp=0;
  const get=p=>{let n=root;for(const k of p){if(!n||n.t!=='d'||!n.c[k])return null;n=n.c[k];}return n;};
  const res=a=>{let base=a.startsWith('/')?[]:a.startsWith('~')?[...HOME]:[...cwd];
    const rest=(a.startsWith('~')?a.slice(1):a).split('/').filter(Boolean);
    for(const s of rest){if(s==='.')continue;if(s==='..'){base.pop();continue;}base.push(s);}return base;};
  const pathStr=p=>'/'+p.join('/');
  const prompt=()=>{const s=pathStr(cwd);const h='/'+HOME.join('/');return 'studente@cipolla:'+(s.startsWith(h)?'~'+s.slice(h.length):s)+'$';};
  const MAN={pwd:'pwd – mostra il percorso della cartella corrente.',ls:'ls [-l] – elenca i file; -l mostra permessi e dimensioni.',cd:'cd CARTELLA – entra in una cartella; cd .. torna su; cd da solo torna alla home.',
    mkdir:'mkdir NOME – crea una cartella.',touch:'touch NOME – crea un file vuoto.',cat:'cat FILE – mostra il contenuto di un file.',cp:'cp ORIGINE DESTINAZIONE – copia un file.',
    mv:'mv ORIGINE DESTINAZIONE – sposta o rinomina.',rm:'rm FILE – elimina un file (senza cestino!). rm -r CARTELLA elimina una cartella.',man:'man COMANDO – mostra il manuale di un comando.',clear:'clear – pulisce lo schermo.',help:'help – elenca i comandi disponibili.'};
  function run(line){
    const parts=line.trim().split(/\s+/).filter(Boolean); if(!parts.length)return {out:[]};
    const [cmd,...args]=parts; const flags=args.filter(a=>a.startsWith('-')); const pos=args.filter(a=>!a.startsWith('-'));
    const E=m=>({out:[{c:'e',t:m}],err:true});
    const parentOf=p=>get(p.slice(0,-1));
    switch(cmd){
      case 'pwd': return {out:[{t:pathStr(cwd)}]};
      case 'ls':{const p=pos[0]?res(pos[0]):cwd;const n=get(p);if(!n)return E(`ls: impossibile accedere a '${pos[0]}': file o directory non esistente`);
        if(n.t==='f')return {out:[{t:pos[0]}]};
        const names=Object.keys(n.c).sort(); if(!names.length)return {out:[{c:'m',t:''}]};
        if(flags.some(f=>f.includes('l')))return {out:names.map(k=>{const x=n.c[k];return x.t==='d'?{c:'d',t:`drwxr-xr-x  studente   4096  ${k}/`}:{t:`-rw-r--r--  studente  ${String(x.data?x.data.length:0).padStart(5)}  ${k}`}})};
        return {out:[{html:names.map(k=>n.c[k].t==='d'?`<span class="d">${esc(k)}/</span>`:esc(k)).join('   ')}]};}
      case 'cd':{const p=pos[0]?res(pos[0]):[...HOME];const n=get(p);if(!n)return E(`cd: ${pos[0]}: file o directory non esistente`);if(n.t!=='d')return E(`cd: ${pos[0]}: non è una directory`);cwd=p;return {out:[]};}
      case 'mkdir':{if(!pos[0])return E('mkdir: manca il nome della cartella');const p=res(pos[0]);const par=parentOf(p);if(!par||par.t!=='d')return E('mkdir: percorso non valido');
        if(par.c[p.at(-1)])return E(`mkdir: impossibile creare '${pos[0]}': il file esiste`);par.c[p.at(-1)]={t:'d',c:{}};return {out:[]};}
      case 'touch':{if(!pos[0])return E('touch: manca il nome del file');const p=res(pos[0]);const par=parentOf(p);if(!par||par.t!=='d')return E('touch: percorso non valido');
        if(!par.c[p.at(-1)])par.c[p.at(-1)]={t:'f',data:''};return {out:[]};}
      case 'cat':{if(!pos[0])return E('cat: manca il nome del file');const n=get(res(pos[0]));if(!n)return E(`cat: ${pos[0]}: file o directory non esistente`);if(n.t==='d')return E(`cat: ${pos[0]}: è una directory`);
        return {out:[{t:n.data||'(file vuoto)'}]};}
      case 'cp': case 'mv':{if(pos.length<2)return E(`${cmd}: servono origine e destinazione, es. ${cmd} a.txt b.txt`);
        const sp=res(pos[0]);const s=get(sp);if(!s)return E(`${cmd}: impossibile trovare '${pos[0]}'`);
        if(s.t==='d'&&cmd==='cp')return E('cp: per copiare una cartella serve -r (non richiesto in questo gioco)');
        let dp=res(pos[1]);const d=get(dp);if(d&&d.t==='d')dp=[...dp,sp.at(-1)];
        const par=parentOf(dp);if(!par||par.t!=='d')return E(`${cmd}: destinazione non valida`);
        par.c[dp.at(-1)]=cmd==='cp'?JSON.parse(JSON.stringify(s)):s;
        if(cmd==='mv'&&pathStr(sp)!==pathStr(dp))delete parentOf(sp).c[sp.at(-1)];
        return {out:[]};}
      case 'rm':{if(!pos[0])return E('rm: manca il nome del file');const p=res(pos[0]);const n=get(p);if(!n)return E(`rm: impossibile rimuovere '${pos[0]}': file o directory non esistente`);
        if(n.t==='d'&&!flags.some(f=>f.includes('r')))return E(`rm: impossibile rimuovere '${pos[0]}': è una directory (usa rm -r)`);
        delete parentOf(p).c[p.at(-1)];return {out:[]};}
      case 'man':{if(!pos[0])return E('Quale pagina di manuale vuoi? Es. man ls');return MAN[pos[0]]?{out:[{t:MAN[pos[0]]}]}:E(`Nessuna voce di manuale per ${pos[0]}`);}
      case 'help': return {out:[{t:'Comandi: '+Object.keys(MAN).join(', ')}]};
      case 'clear': return {clear:true,out:[]};
      default: return E(`${cmd}: comando non trovato`);
    }
  }
  const at=p=>get(['home','studente',...p]);
  const TASKS=[
    {gui:'Nella GUI guardi la barra del percorso.',goal:'Scopri in quale cartella ti trovi.',ok:c=>c.cmd==='pwd',ex:'pwd',why:'<code>pwd</code> (print working directory) mostra la cartella corrente: /home/studente è la tua “home”.'},
    {gui:'Nella GUI apri la cartella e guardi i file in modalità dettagli.',goal:'Elenca il contenuto della cartella, con i dettagli.',ok:c=>c.cmd==='ls'&&c.args.some(a=>a.startsWith('-')&&a.includes('l')),ex:'ls -l',why:'<code>ls -l</code> elenca i file con permessi e dimensioni. La <b>d</b> iniziale indica una cartella (directory).'},
    {gui:'Nella GUI: clic destro › Nuova cartella › “scuola”.',goal:'Crea la cartella scuola.',ok:()=>at(['scuola'])?.t==='d',ex:'mkdir scuola',why:'<code>mkdir</code> (make directory) chiede al file system di creare una cartella.'},
    {gui:'Nella GUI fai doppio clic sulla cartella scuola.',goal:'Entra nella cartella scuola.',ok:()=>pathStr(cwd)==='/home/studente/scuola',ex:'cd scuola',why:'<code>cd</code> (change directory) cambia la cartella corrente: guarda come è cambiato il prompt.'},
    {gui:'Nella GUI: clic destro › Nuovo documento › “note.txt”.',goal:'Crea il file vuoto note.txt.',ok:()=>at(['scuola','note.txt'])?.t==='f',ex:'touch note.txt',why:'<code>touch</code> crea un file vuoto: nella tabella del file system compare un nuovo nome.'},
    {gui:'Nella GUI: Copia note.txt, poi Incolla e chiami la copia “copia.txt”.',goal:'Copia note.txt in copia.txt.',ok:()=>at(['scuola','copia.txt'])&&at(['scuola','note.txt']),ex:'cp note.txt copia.txt',why:'<code>cp</code> copia: ora esistono due file distinti, con blocchi distinti sul disco.'},
    {gui:'Nella GUI: clic destro su copia.txt › Rinomina › “appunti.txt”.',goal:'Rinomina copia.txt in appunti.txt.',ok:()=>at(['scuola','appunti.txt'])&&!at(['scuola','copia.txt']),ex:'mv copia.txt appunti.txt',why:'<code>mv</code> sposta o rinomina: il file non viene riscritto, cambia solo il suo nome nella tabella.'},
    {gui:'Nella GUI trascini appunti.txt nel cestino.',goal:'Elimina appunti.txt (e solo quello).',ok:()=>!at(['scuola','appunti.txt'])&&at(['scuola','note.txt']),ex:'rm appunti.txt',why:'Attenzione: <code>rm</code> <b>non usa il cestino</b>. Il nome sparisce dalla tabella, ma i byte restano finché non vengono sovrascritti: ricordi il recupero dei file?'}
  ];
  let ti=0, hinted=false;
  mission(`<b>Missione:</b> sei nel terminale di Linux. Per ogni compito c’è l’azione che faresti con la GUI: traducila nel comando giusto e premi Invio. Scrivi <code>help</code> per l’elenco dei comandi, <code>man ls</code> per il manuale.`);
  play.innerHTML=`<div class="row">
    <div class="col" style="flex:1.6"><div class="term" id="term" aria-label="Terminale"><div id="tout"></div>
      <div class="in l"><span class="p" id="tprompt"></span><input id="tin" aria-label="Comando" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div></div>
    <div class="col"><div class="panel"><h3>Compiti</h3><ol class="tasks" id="tasks"></ol>
      <button class="btn" id="hint" style="margin-top:12px">Mostra il comando (−30 pt)</button></div></div></div>`;
  const out=$('#tout'), inp=$('#tin'), term=$('#term');
  const print=(o)=>{const d=document.createElement('div');d.className='l '+(o.c||'');if(o.html!==undefined)d.innerHTML=o.html;else d.textContent=o.t;out.appendChild(d);};
  const renderTasks=()=>{$('#tasks').innerHTML=TASKS.map((t,k)=>`<li class="${k<ti?'done':k===ti?'now':''}"><b>${t.goal}</b><span class="gui">${t.gui}</span></li>`).join('');$('#tprompt').textContent=prompt();};
  print({t:'Benvenuto nella shell della cipolla. Scrivi un comando e premi Invio.',c:'m'});
  renderTasks();
  term.onclick=()=>inp.focus(); inp.focus();
  $('#hint').onclick=()=>{if(ti>=TASKS.length)return;hinted=true;fb('',`Suggerimento: prova <code>${TASKS[ti].ex}</code>`);inp.focus();};
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'){if(hp>0){hp--;inp.value=hist[hp];}e.preventDefault();return;}
    if(e.key==='ArrowDown'){if(hp<hist.length){hp++;inp.value=hist[hp]||'';}e.preventDefault();return;}
    if(e.key!=='Enter')return;
    const line=inp.value; inp.value='';
    print({html:`<span class="p">${esc(prompt())}</span> ${esc(line)}`});
    if(line.trim()){hist.push(line);} hp=hist.length;
    const r=run(line);
    if(r.clear) out.innerHTML='';
    r.out.forEach(print);
    const parts=line.trim().split(/\s+/);
    if(ti<TASKS.length&&TASKS[ti].ok({cmd:parts[0],args:parts.slice(1)})){
      gain(hinted?70:100,TASKS[ti].why); ti++; hinted=false;
      if(ti>=TASKS.length){renderTasks();later(()=>finish('Hai tradotto ogni azione della GUI in un comando.'),900);return;}
    } else if(r.err){ fb('ko',`il terminale ha risposto con un errore. Controlla il nome del comando e degli argomenti.`); }
    renderTasks(); term.scrollTop=term.scrollHeight;
  });
}

/* ============ LIVELLO 4: FILE SYSTEM ============ */
function initFS(play){
  const NAMES=[['tesina.docx','relazione.pdf','foto.jpg'],['gita.jpg','verifica.odt','musica.mp3'],['video.mp4','appunti.txt','progetto.zip']];
  let round=0;
  mission(`<b>Missione:</b> sei il file system. Il SO ti chiede di aprire un file: cerca il nome nella tabella e seleziona sull’SSD <b>tutti e soli</b> i blocchi da leggere. Poi decidi se le foto perse si possono recuperare.`);
  function newRound(){
    const used=new Set([0,1,2,3]); const files=[];
    const run=len=>{for(let tries=0;tries<500;tries++){const s=4+Math.floor(Math.random()*(48-4-len));let ok=true;for(let k=0;k<len;k++)if(used.has(s+k)||used.has(s+k-1)&&k===0&&false)ok=false;if(ok){const b=[];for(let k=0;k<len;k++){used.add(s+k);b.push(s+k);}return b;}}return [];};
    NAMES[round].forEach((n,k)=>{const len=2+Math.floor(Math.random()*3);let b=run(len);if(k===round%3||round===2){const extra=run(1);b=b.concat(extra);}files.push({n,b});});
    const target=files[Math.floor(Math.random()*files.length)];
    const sel=new Set();
    const fmt=b=>b.join(', ');
    play.innerHTML=`<div class="row">
      <div class="col"><div class="panel"><h3>Tabella del file system</h3>
        <table class="fst"><tr><th>Nome</th><th>Dim.</th><th>Blocchi</th></tr>${files.map(f=>`<tr class="${f===target?'target':''}"><td>${f.n}</td><td>${f.b.length*4} KB</td><td>${fmt(f.b)}</td></tr>`).join('')}</table>
        <p class="muted" style="margin-top:12px;font-size:15px">Blocchi da 4 KB. I blocchi 0–3 contengono la tabella stessa.</p></div></div>
      <div class="col" style="flex:1.5"><div class="panel"><h3>SSD · il SO chiede: apri <span style="color:var(--y)">${target.n}</span> (round ${round+1} di 3)</h3>
        <div class="grid48" id="grid"></div>
        <div style="display:flex;gap:12px;margin-top:14px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="read">Leggi i blocchi selezionati</button><span class="muted" id="cnt">0 selezionati</span></div></div></div></div>`;
    const g=$('#grid');
    for(let b=0;b<48;b++){const c=document.createElement('button');c.className='cell'+(b<4?' meta':used.has(b)?' used':'');c.textContent=b;c.setAttribute('aria-label','Blocco '+b);
      c.onclick=()=>{if(b<4){lose('i blocchi 0–3 contengono la tabella del file system, non i dati del file.');return;}
        sel.has(b)?sel.delete(b):sel.add(b);c.classList.toggle('sel');$('#cnt').textContent=sel.size+' selezionati';};
      g.appendChild(c);}
    $('#read').onclick=()=>{
      const want=new Set(target.b);
      const same=sel.size===want.size&&[...sel].every(x=>want.has(x));
      if(same){
        const frag=target.b.some((x,k)=>k>0&&x!==target.b[k-1]+1);
        gain(100,`il file system ha tradotto il nome <b>${target.n}</b> nei blocchi ${fmt(target.b)}.`+(frag?' Questo file è <b>frammentato</b>: i suoi blocchi non sono tutti vicini.':''));
        round++; $('#read').disabled=true;
        later(()=>{ if(cur.over)return; round<3?newRound():scenarios(); },1400);
      } else {
        const miss=target.b.filter(x=>!sel.has(x)).length, extra=[...sel].filter(x=>!want.has(x)).length;
        lose(`${miss?`mancano ${miss} blocchi di ${target.n}`:''}${miss&&extra?' e ':''}${extra?`hai selezionato ${extra} blocchi di altri file`:''}. Controlla la riga evidenziata nella tabella.`);
      }
    };
  }
  function scenarios(){
    mission(`<b>Missione, parte 2:</b> un compagno ha perso delle foto. Per ogni situazione decidi se i file sono ancora recuperabili con un software come PhotoRec.`);
    quiz(play,[
      {q:'Luca cancella per sbaglio le foto della gita dalla chiavetta e non ci scrive più nulla.',o:['Recuperabili','Non recuperabili'],why:'cancellare toglie il nome dalla tabella, ma i byte delle foto restano nei blocchi finché non vengono sovrascritti.',no:'la cancellazione non tocca i byte: restano sulla chiavetta.'},
      {q:'Sara fa una formattazione <b>rapida</b> della chiavetta con le foto.',o:['Recuperabili (in genere)','Non recuperabili'],why:'la formattazione rapida ricrea solo il file system vuoto: i vecchi byte sono ancora lì.',no:'la rapida riscrive solo la tabella, non i blocchi dei file.'},
      {q:'Marco fa una formattazione <b>profonda (completa)</b> dell’hard disk.',o:['Non recuperabili','Recuperabili'],why:'la formattazione profonda sovrascrive ogni byte, ad esempio con zeri: non resta nulla da recuperare.',no:'la profonda riscrive tutto il supporto.'},
      {q:'Giulia cancella le foto, poi copia un film da 4 GB sulla stessa chiavetta quasi piena.',o:['Probabilmente non più recuperabili','Sicuramente recuperabili'],why:'i blocchi “liberi” delle foto sono stati riutilizzati per il film: i vecchi byte sono stati sovrascritti. Dopo una cancellazione per errore, meglio non scrivere più nulla!',no:'scrivendo nuovi dati il file system riusa i blocchi liberi, cioè proprio quelli delle foto.'},
      {q:'Devi copiare un file da 5 GB, ma la chiavetta è in FAT32 e il sistema rifiuta la copia. Cosa fai?',o:['Formatto la chiavetta in exFAT','Rinomino il file con un nome più corto','Copio il file due volte'],why:'FAT32 accetta file al massimo di 4 GB; exFAT no, ed è letto da Windows, macOS e Linux.',no:'il problema è il limite di 4 GB per file di FAT32.'}
    ],()=>finish('Hai tradotto nomi in blocchi e salvato le foto dei compagni.'),'Situazione');
  }
  newRound();
}

      {q:'Perché un SO ha bisogno di un driver diverso per ogni modello?',o:['Ogni modello capisce comandi diversi','Per occupare meno spazio su disco','Perché lo chiede il file system'],why:'il SO parla una lingua sola; il driver fa da interprete verso la lingua di quel preciso modello.'}

  const swap=[];
  const EV=[
    {t:'open',p:'Chrome',n:2},{t:'open',p:'Spotify',n:1},{t:'open',p:'Gioco',n:3},
    {t:'close',p:'Gioco'},
    {t:'protect',txt:'Chrome chiede di leggere la memoria di Spotify.'},
    {t:'open',p:'Word',n:1},{t:'open',p:'Editor video',n:3}
  ];
  let e=0;
  mission(`<b>Missione:</b> sei il gestore della memoria di un PC con <b>8 GB di RAM</b>. In questo gioco ogni processo occupa blocchi <b>vicini</b>. Clicca il primo blocco da cui far partire il processo; se non c’è posto, usa lo swap sull’SSD.`);
  const fits=n=>{for(let s=0;s+n<=8;s++){if(ram.slice(s,s+n).every(x=>x===null))return true;}return false;};
  const free=()=>ram.filter(x=>x===null).length;
  function render(){
    const ev=EV[e];
    let instr='';
    if(!ev) instr='Fatto!';
    else if(ev.t==='open') instr=`Il SO deve avviare <b>${ev.p}</b>, che chiede <b>${ev.n} GB</b>. Clicca il blocco di partenza.`;
    else if(ev.t==='close') instr=`L’utente chiude <b>${ev.p}</b>: clicca i suoi blocchi per liberare (deallocare) la memoria.`;
    else instr=ev.txt+' Cosa fai?';
    let slots='';
    ram.forEach((x,k)=>{slots+=x?`<button class="slot full" data-s="${k}" style="background:${COL[x]};color:${INK[x]||'#1C2433'}">${x}<span class="gb">1 GB</span></button>`
                          :`<button class="slot" data-s="${k}">libero<span class="gb">1 GB</span></button>`;});
    const speed=Math.max(10,100-swap.length*30);
    play.innerHTML=`<div class="panel" style="margin-bottom:16px"><h3>${instr}</h3>
      ${ev&&ev.t==='open'?`<button class="btn" id="useswap">Usa lo swap sull’SSD</button>`:''}
      ${ev&&ev.t==='protect'?`<div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="allow">Consenti</button><button class="btn" id="deny">Nega l’accesso</button></div>`:''}</div>
      <div class="panel"><h3>RAM · 8 GB <span class="muted" style="font-family:var(--body);font-size:15px">(${free()} GB liberi)</span></h3><div class="ram">${slots}</div>
      <div class="row" style="margin-top:16px;align-items:flex-start">
        <div class="col" style="flex:2"><h3>Swap sull’SSD (memoria virtuale)</h3><div class="swap">${swap.length?swap.map(p=>`<button class="swapitem" data-sw="${p}" style="background:${COL[p]};color:${INK[p]||'#1C2433'}">${p}</button>`).join(''):'<span class="muted">vuoto</span>'}</div></div>
        <div class="col"><h3>Velocità del PC</h3><div class="meter"><i style="width:${speed}%;background:${speed<60?'var(--ko)':'var(--ok)'}"></i></div><p class="muted" style="font-size:15px;margin-top:6px">${swap.length?'Lo swap è molto più lento della RAM.':'Tutto in RAM: veloce.'}</p></div>
      </div></div>`;
    play.querySelectorAll('.slot').forEach(b=>b.onclick=()=>clickSlot(+b.dataset.s));
    play.querySelectorAll('.swapitem').forEach(b=>b.onclick=()=>clickSwap(b.dataset.sw));
    const us=$('#useswap'); if(us) us.onclick=useSwap;
    const al=$('#allow'); if(al) al.onclick=()=>lose('senza <b>protezione della memoria</b> Chrome potrebbe leggere o rovinare i dati di Spotify. Ogni processo deve restare nel proprio spazio.');
    const dn=$('#deny'); if(dn) dn.onclick=()=>{gain(100,'protezione della memoria: un processo non può leggere né scrivere lo spazio di un altro.');next();};
  }
  function next(){e++; if(e>=EV.length){render();later(()=>finish('Hai allocato, liberato e protetto la memoria.'),1000);} else render();}
  function clickSlot(s){
    if(cur.over)return;
    const ev=EV[e]; if(!ev)return;
    if(ev.t==='open'){
      if(ram[s]==='SO'){lose('quei blocchi sono del sistema operativo: sono protetti.');return;}
      if(ram[s]){lose(`il blocco ${s+1} è già occupato da ${ram[s]}.`);return;}
      if(s+ev.n>8||!ram.slice(s,s+ev.n).every(x=>x===null)){
        lose(`da qui non ci sono ${ev.n} GB liberi <b>vicini</b>.${fits(ev.n)?' Prova un altro punto.':' Guarda bene: forse non ci sono in tutta la RAM…'}`);return;}
      for(let k=s;k<s+ev.n;k++)ram[k]=ev.p;
      gain(100,`allocati ${ev.n} GB a <b>${ev.p}</b>: ora il processo ha il suo spazio in RAM.`); next();
    } else if(ev.t==='close'){
      if(ram[s]===ev.p){for(let k=0;k<8;k++)if(ram[k]===ev.p)ram[k]=null;gain(100,`<b>${ev.p}</b> è chiuso: i suoi GB sono stati <b>deallocati</b> e tornano liberi per altri processi.`);next();}
      else lose(ram[s]?`${ram[s]} è ancora in uso: devi liberare la memoria di ${ev.p}.`:'quel blocco è già libero.');
    } else fb('','Rispondi con i pulsanti in alto.');
  }
  function clickSwap(p){
    const ev=EV[e]; if(!ev)return;
    if(ev.t==='close'&&p===ev.p){swap.splice(swap.indexOf(p),1);gain(100,`<b>${p}</b> è chiuso e anche la sua parte sullo swap viene liberata.`);next();}
    else if(ev.t==='close') lose(`${p} è ancora in uso: devi chiudere ${ev.p}.`);
  }
  function useSwap(){
    if(cur.over)return;
    const ev=EV[e];
    if(fits(ev.n)){lose(`c’erano ${ev.n} GB liberi e vicini in RAM: usare lo swap avrebbe rallentato il PC senza motivo.`);return;}
    swap.push(ev.p);
    const f=free();
    gain(100,f>=ev.n?`ci sono ${f} GB liberi in totale, ma <b>non vicini</b>: il SO ricorre alla memoria virtuale e sposta dati sull’SSD. Il PC rallenta.`
                    :`la RAM non basta: il SO usa la <b>memoria virtuale</b> e sposta dati sull’SSD (swap). Funziona, ma il PC rallenta.`);
    next();
  }
  render();
}

/* ============ LIVELLO 1: KERNEL / CPU ============ */
function initCPU(play){
  const P={B:{name:'Browser',need:3,c:'#4472C4',ink:'#FFFFFF'},S:{name:'Spotify',need:2,c:'#F4B183'},W:{name:'Word',need:3,c:'#7DBA5C'},A:{name:'Antivirus',need:2,c:'#FFD966'}};
  Object.values(P).forEach(p=>{p.done=0;p.state='pronto';});
  let queue=['B','S','W','A'], turn=0, gantt=[], irq=null, wordBlockedAt=null, wordBlockedOnce=false, kbdDone=false;
  mission(`<b>Missione:</b> sei lo scheduler, con <b>Round Robin</b>: dai la CPU per un quanto di tempo al <b>primo processo della coda dei pronti</b>, poi torna in fondo. I processi in attesa non possono usare la CPU. Se suona un <b>interrupt</b>, gestiscilo entro 6 secondi!`);
  function render(){
    const procs=Object.entries(P).map(([k,p])=>`<button class="proc ${p.state}" data-p="${k}" style="border-color:${p.state==='pronto'&&queue[0]===k?p.c:'var(--line)'}">
       <h4>${p.name}</h4><span class="state" style="color:${p.state==='pronto'?'var(--ok)':p.state==='attesa'?'var(--ko)':'var(--muted)'}">${p.state==='attesa'?'in attesa del disco':p.state}</span>
       <div class="bar"><i style="width:${p.done/p.need*100}%;background:${p.c}"></i></div><span class="muted" style="font-size:14px">${p.done}/${p.need} quanti</span></button>`).join('');
    play.innerHTML=`<div id="irq"></div>
      <div class="panel" style="margin-bottom:16px"><h3>Processi · clicca quello a cui dare la CPU</h3><div class="procs">${procs}</div></div>
      <div class="row">
        <div class="col"><div class="panel"><h3>Coda dei pronti</h3><div class="queue">${queue.length?queue.map((k,i)=>`<span class="qi" style="background:${P[k].c};color:${P[k].ink||'#1C2433'}">${i===0?'▶ ':''}${P[k].name}</span>`).join(''):'<span class="muted">vuota</span>'}</div></div></div>
        <div class="col" style="flex:1.4"><div class="panel"><h3>Uso della CPU nel tempo</h3><div class="gantt">${gantt.map(g=>g==='!'?'<span class="irq" title="interrupt">!</span>':`<span style="background:${P[g].c};color:${P[g].ink||'#1C2433'}">${g}</span>`).join('')||'<span class="muted">ancora nulla</span>'}</div></div></div>
      </div>`;
    play.querySelectorAll('.proc').forEach(b=>b.onclick=()=>pick(b.dataset.p));
    if(irq) drawIrq();
  }
  function pick(k){
    if(cur.over)return;
    if(irq){fb('','<b>Attenzione:</b> c’è un interrupt in attesa: la CPU deve gestirlo prima di tutto.');return;}
    const p=P[k];
    if(p.state==='finito'){fb('',`${p.name} ha già finito il suo lavoro.`);return;}
    if(p.state==='attesa'){lose(`${p.name} è <b>in attesa</b> del disco: anche con la CPU non potrebbe fare nulla.`);return;}
    if(queue[0]!==k){lose(`con Round Robin tocca a <b>${P[queue[0]].name}</b>, il primo della coda. Saltare il turno non è equo.`);return;}
    queue.shift(); p.done++; turn++; gantt.push(k);
    let msg=`${p.name} usa la CPU per un quanto di tempo.`;
    if(p.done>=p.need){p.state='finito';msg+=' Ha finito: esce dallo scheduling.';}
    else if(k==='W'&&!wordBlockedOnce){p.state='attesa';wordBlockedOnce=true;wordBlockedAt=turn;msg+=' Ora deve salvare sul disco: passa <b>in attesa</b> e lascia la coda.';}
    else {queue.push(k);msg+=' Torna in fondo alla coda.';}
    gain(50,msg);
    if(Object.values(P).every(x=>x.state==='finito')){render();later(()=>finish('Tutti i processi hanno completato il loro lavoro.'),900);return;}
    if(turn===2&&!kbdDone) raise('kbd');
    else if(wordBlockedAt&&P.W.state==='attesa'&&(turn>=wordBlockedAt+2||queue.length===0)) raise('disk');
    render();
  }
  function raise(type){
    irq={type,left:6};
    const t=setInterval(()=>{ if(!irq){clearInterval(t);return;} irq.left--; const cd=$('#cd'); if(cd)cd.textContent=irq.left;
      if(irq.left<=0){clearInterval(t); const was=irq.type; handle(true,was);} },1000);
    cur.timers.push(t);
  }
  function drawIrq(){
    const txt=irq.type==='kbd'?'⌨️ <b>Interrupt dalla tastiera:</b> l’utente ha premuto un tasto!':'💾 <b>Interrupt dal disco:</b> il salvataggio di Word è terminato!';
    $('#irq').innerHTML=`<div class="irqbox" style="margin-bottom:16px"><span class="cd" id="cd">${irq.left}</span><p style="flex:1">${txt}</p><button class="btn primary" id="hirq">Gestisci l’interrupt</button></div>`;
    $('#hirq').onclick=()=>handle(false,irq.type); $('#hirq').focus();
  }
  function handle(late,type){
    if(!irq)return; irq=null; gantt.push('!');
    if(type==='kbd'){kbdDone=true;}
    if(type==='disk'){P.W.state='pronto';queue.push('W');}
    const what=type==='kbd'?'la CPU salva lo stato, legge il tasto e riprende da dove era rimasta.':'Word torna <b>pronto</b> e rientra in fondo alla coda.';
    if(late) lose('interrupt gestito troppo tardi: '+what);
    else gain(80,'interrupt gestito: '+what);
    if(!cur.over) render();
  }
  render();
}

/* ============ BOSS ============ */
function initBoss(play){
  const STEPS=[
    {l:'Interprete',c:'#FFD966',t:'Legge “cat appunti.txt” e chiede di aprire il file'},
    {l:'File system',c:'#C9C9C9',t:'Trova il nome nella tabella, controlla i permessi e i blocchi'},
    {l:'Input/Output',c:'#8EA9DB',t:'Il driver dell’SSD legge i blocchi richiesti'},
    {l:'Memoria',c:'#7DBA5C',t:'Riserva in RAM lo spazio dove copiare i dati'},
    {l:'Kernel',c:'#F4B183',t:'Mette cat in attesa e lo riattiva con l’interrupt di fine lettura'},
    {l:'Hardware',c:'#4472C4',t:'SSD, RAM e CPU eseguono davvero il lavoro'}];
  let k=0;
  mission(`<b>Boss, parte 1:</b> hai digitato <code>cat appunti.txt</code>. Rimetti in ordine il viaggio della richiesta, dal livello più esterno a quello più interno.`);
  const order=shuffle(STEPS.map((s,i)=>({...s,i})));
  const render=()=>{
    play.innerHTML=`<div class="row"><div class="col" style="flex:2"><div class="steps">${order.map(s=>`<button class="stepc" data-i="${s.i}" ${s.i<k?'disabled':''}>${s.t}</button>`).join('')}</div></div>
      <div class="col"><div class="panel"><h3>Il viaggio</h3><div class="seq">${STEPS.slice(0,k).map(s=>`<div style="background:${s.c};color:${s.l==='Hardware'?'#fff':'#1C2433'}">${s.l}</div>`).join('')||'<span class="muted">Scegli il primo passo.</span>'}</div></div></div></div>`;
    play.querySelectorAll('.stepc').forEach(b=>b.onclick=()=>{
      if(cur.over)return;
      const i=+b.dataset.i;
      if(i===k){k++;gain(50,`passo ${k}: <b>${STEPS[i].l}</b>.`);render();if(k===STEPS.length){fb('ok','<span class="tag">Perfetto!</span>La richiesta è arrivata all’hardware. Il contenuto del file ora risale livello per livello fino allo schermo.');later(()=>{if(!cur.over)part2();},1800);}}
      else lose(`non ancora. La richiesta scende dal livello più esterno: ora serve il livello <b>${STEPS[k].l}</b>.`);
    });
  };
  render();
  function part2(){
    mission('<b>Boss, parte 2:</b> sei domande finali. Ogni errore costa una vita.');
    quiz(play,[
      {q:'Cosa distingue un <b>processo</b> da un programma installato sull’SSD?',o:['Il processo è in esecuzione: vive in RAM e usa la CPU','Il processo è il file salvato sull’SSD','Sono esattamente la stessa cosa'],why:'il programma è un file passivo; il processo è il programma in esecuzione, con PID e stato.'},
      {q:'Premi un tasto mentre ascolti musica. Chi avvisa la CPU?',o:['Un interrupt della tastiera','Lo scheduler','Il file system'],why:'la periferica invia un interrupt: la CPU sospende, gestisce l’evento e riprende.'},
      {q:'Colleghi una stampante e compare “dispositivo sconosciuto”. Cosa manca?',o:['Il driver','Lo swap','La formattazione'],why:'senza driver il SO non sa quali comandi capisce quella periferica.'},
      {q:'Dopo una formattazione <b>rapida</b> di una chiavetta, i vecchi file…',o:['spesso si possono ancora recuperare','sono stati sovrascritti con zeri','diventano più grandi'],why:'la rapida ricrea solo il file system: i byte restano finché non vengono sovrascritti.'},
      {q:'La RAM è piena e apri un’altra app. Dove sposta dati il SO?',o:['Sull’SSD, nello swap (memoria virtuale)','Nella cache della stampante','Nel registro della CPU'],why:'la memoria virtuale usa l’SSD come estensione della RAM, a costo di rallentare.'},
      {q:'Quale comando Linux elenca i <b>processi attivi</b>?',o:['<code>ps aux</code>','<code>ls -l</code>','<code>df -h</code>'],why:'<code>ps aux</code> interroga il kernel; <code>ls</code> elenca file, <code>df</code> mostra lo spazio su disco.'}
    ],()=>finish('Hai attraversato tutti i livelli del sistema operativo.'),'Domanda');
  }
}

const INIT={shell:initShell,fs:initFS,io:initIO,mem:initMem,cpu:initCPU,boss:initBoss};
showMap();
</script>
